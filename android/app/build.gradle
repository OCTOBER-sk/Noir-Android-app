plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.noir.android"
    compileSdk 35

    defaultConfig {
        applicationId "com.noir.android"
        minSdk 26
        targetSdk 35
        versionCode 203
        versionName "2.3.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig null
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.2.20"

    // Pure-JVM unit tests for the accessibility bridge helpers
    // (redaction, payload cap, event buffer bounds, consent token, gesture
    // refusal). Deliberately plain JUnit: the helpers under test import no
    // android.* and touch no framework class, so `testDebugUnitTest` needs
    // neither a device nor Robolectric.
    testImplementation "junit:junit:4.13.2"
}
